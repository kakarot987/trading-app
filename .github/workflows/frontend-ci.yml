name: Frontend CI

on:
  push:
    branches:
      - main
      - milestone/M1-resource-optimization
    paths:
      - 'client-connection/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - milestone/M1-resource-optimization
    paths:
      - 'client-connection/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-connection

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client-connection/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
