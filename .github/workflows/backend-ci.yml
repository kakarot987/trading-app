name: Backend tests

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test all backend modules
        run: bash ./gradlew test --no-daemon --console=plain
