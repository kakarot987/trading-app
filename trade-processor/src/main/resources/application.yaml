spring:
  application:
    name: trade-processor

  # R2DBC Postgres connection
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/trades}
    username: ${SPRING_R2DBC_USERNAME:trader}
    password: ${SPRING_R2DBC_PASSWORD:traderpass}

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/trades}
    user: ${SPRING_FLYWAY_USER:trader}
    password: ${SPRING_FLYWAY_PASSWORD:traderpass}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: trade-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging:
  level:
    root: OFF
    org.springframework.kafka: OFF
    com.trading: OFF
    org.springframework: OFF
    reactor.core.publisher: OFF
    org.springframework.r2dbc: OFF

# Actuator endpoints for health/metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
