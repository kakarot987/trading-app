spring:
  application:
    name: historical-data-service

  # R2DBC for reactive queries
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/trades
    username: trader
    password: traderpass

  # Flyway using JDBC (explicit so Flyway runs)
  flyway:
    enabled: true
    url: jdbc:postgresql://postgres:5432/trades
    user: trader
    password: traderpass
    locations: classpath:db/migration

  # Redis reactive connection
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8084
  compression:
    enabled: true

# Logging
logging:
  level:
    root: INFO
    com.trading.historical_service: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cache:
    recent-data-threshold-ms: 3600000
    candle-ttl-minutes: 15
  query:
    max-time-range-days: 365
    max-limit: 1000
    default-limit: 500

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker

  r2dbc:
    url: r2dbc:postgresql://postgres:5432/trades
    username: trader
    password: traderpass

  flyway:
    enabled: true
    url: jdbc:postgresql://postgres:5432/trades
    user: trader
    password: traderpass
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: WARN
    com.trading.historical_service: INFO
