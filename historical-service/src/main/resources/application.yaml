spring:
  application:
    name: historical-data-service

  # R2DBC for reactive queries
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/trades
    username: trader
    password: ${SPRING_R2DBC_PASSWORD:}
    # Check a pooled connection before handing it to an API request.
    # Old sockets can survive a PostgreSQL container replacement.
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 30s
      max-life-time: 10m
      max-acquire-time: 10s

  # Flyway using JDBC (explicit so Flyway runs)
  flyway:
    enabled: true
    url: jdbc:postgresql://postgres:5432/trades
    user: trader
    password: ${SPRING_R2DBC_PASSWORD:}
    locations: classpath:db/migration

  # Redis reactive connection
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8084
  compression:
    enabled: true

# Logging
logging:
  level:
    root: INFO
    com.trading.historical_service: INFO

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cache:
    recent-data-threshold-ms: 3600000
    candle-ttl-minutes: 15
  query:
    max-time-range-days: 365
    max-limit: 1000
    default-limit: 500

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker

  r2dbc:
    url: r2dbc:postgresql://postgres:5432/trades
    username: trader
    password: ${SPRING_R2DBC_PASSWORD:}

  flyway:
    enabled: true
    url: jdbc:postgresql://postgres:5432/trades
    user: trader
    password: ${SPRING_R2DBC_PASSWORD:}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: WARN
    com.trading.historical_service: INFO
